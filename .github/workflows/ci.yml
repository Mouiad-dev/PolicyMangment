# Runs on every push and pull request (FND-17). Three jobs run in parallel.
name: CI

on:
  push:
  pull_request:

# A newer push on the same branch cancels the older, still-running run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, spelling, types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.7.9"
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --frozen
      - name: pre-commit (ruff, typos, yaml, toml, whitespace)
        run: uv run pre-commit run --all-files --show-diff-on-failure
      - name: mypy
        run: uv run mypy --strict src tests

  test:
    name: Migrations and tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: policydesk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d policydesk_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DB__HOST: localhost
      DB__PORT: "5432"
      DB__NAME: policydesk_test
      DB__USER: app
      DB__PASSWORD: app
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.7.9"
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --frozen
      - name: Migrate an empty database
        run: uv run alembic upgrade head
      - name: Models match migrations (alembic check)
        run: uv run alembic check
      - name: Exactly one migration head
        run: test "$(uv run alembic heads | wc -l)" -eq 1
      - name: Tests with coverage
        run: uv run pytest -rs --cov=policydesk --cov-report=term-missing

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: prod
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
