[project]
name = "policydesk"
version = "0.1.0"
description = "PolicyDesk — car and home insurance app (learning project)."
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.13",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pre-commit>=4.0",
    "httpx>=0.27",
    "httpx2>=2.13.1",
    "ipython>=9.17.1",
    "pytest-cov>=7.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/policydesk"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]
# Never touch the notes in docs/ or Alembic's generated files.
extend-exclude = ["docs", "src/policydesk/core/db/alembic"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_configs = true
exclude = ["src/policydesk/core/db/alembic/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
filterwarnings = ["error"]
